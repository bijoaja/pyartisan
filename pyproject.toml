[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyartisan"
version = "1.0.0"
description = "AI-powered Python Web Development Toolkit — Artisan-like CLI for Flask, FastAPI, and beyond"
requires-python = ">=3.10"
dependencies = [
    "click",
    "flask",
    "sqlalchemy",
    "tomli; python_version < '3.11'",
    "jinja2",
    "pyyaml",
]

[project.scripts]
pyartisan = "pyartisan.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyartisan = ["templates/plugin_init/**/*"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7",
    "mypy>=1.10.0",
    "pytest",
    "ruff>=0.4.0",
    "types-PyYAML",
]

[tool.mypy]
python_version = "3.10"
files = ["src/pyartisan"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pyartisan.utils.*",
    "pyartisan.config.*",
    "pyartisan.core.exceptions",
    "pyartisan.core.manifest",
    "pyartisan.core.registration",
    "pyartisan.shared.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "tomli.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B904", # raise ... from err in exception handlers
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
# B404/B603/B607: every subprocess call passes an argv list, never shell=True,
# and runs fixed executables (git, uv, docker, python).
skips = ["B404", "B603", "B607"]
